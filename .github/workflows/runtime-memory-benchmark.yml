name: runtime-memory-benchmark

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Benchmark profile"
        required: false
        default: "quick"
        type: choice
        options:
          - quick
          - full
      model:
        description: "Models to benchmark"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - tiny
          - small
          - medium
      workers:
        description: "Worker counts"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - "1"
          - "4"
      paired_rounds:
        description: "0 uses profile default"
        required: false
        default: "0"
        type: string
      image_count:
        description: "0 uses profile default"
        required: false
        default: "0"
        type: string
  schedule:
    - cron: "0 4 * * 6"

permissions:
  contents: read

concurrency:
  group: runtime-memory-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare runtime-memory benchmark package
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      image_count: ${{ steps.plan.outputs.image_count }}
      paired_rounds: ${{ steps.plan.outputs.paired_rounds }}
      profile: ${{ steps.plan.outputs.profile }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-converter.txt

      - name: Resolve benchmark plan
        id: plan
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_PROFILE: ${{ inputs.profile || 'quick' }}
          REQUESTED_MODEL: ${{ inputs.model || 'all' }}
          REQUESTED_WORKERS: ${{ inputs.workers || 'both' }}
          REQUESTED_ROUNDS: ${{ inputs.paired_rounds || '0' }}
          REQUESTED_IMAGES: ${{ inputs.image_count || '0' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EVENT_NAME -eq 'schedule') {
            $profile = 'full'
            $requestedModel = 'all'
            $requestedWorkers = 'both'
          } else {
            $profile = $env:REQUESTED_PROFILE
            $requestedModel = $env:REQUESTED_MODEL
            $requestedWorkers = $env:REQUESTED_WORKERS
          }
          if ($profile -notin @('quick', 'full')) { throw "invalid profile: $profile" }
          if ($requestedModel -notin @('all', 'tiny', 'small', 'medium')) { throw "invalid model: $requestedModel" }
          if ($requestedWorkers -notin @('both', '1', '4')) { throw "invalid workers: $requestedWorkers" }
          $imageCount = [int]$env:REQUESTED_IMAGES
          if ($imageCount -eq 0) { $imageCount = if ($profile -eq 'full') { 100 } else { 30 } }
          $pairedRounds = [int]$env:REQUESTED_ROUNDS
          if ($pairedRounds -eq 0) { $pairedRounds = if ($profile -eq 'full') { 3 } else { 1 } }
          if ($imageCount -lt 1 -or $imageCount -gt 1000) { throw 'invalid image_count' }
          if ($pairedRounds -lt 1 -or $pairedRounds -gt 10) { throw 'invalid paired_rounds' }
          $models = if ($requestedModel -eq 'all') { @('tiny', 'small', 'medium') } else { @($requestedModel) }
          $workerSet = if ($requestedWorkers -eq 'both') { @(1, 4) } else { @([int]$requestedWorkers) }
          $include = @()
          foreach ($model in $models) {
            foreach ($workers in $workerSet) {
              $include += [ordered]@{ model = $model; workers = [int]$workers }
            }
          }
          $matrixJson = ([ordered]@{ include = @($include) } | ConvertTo-Json -Depth 4 -Compress)
          "matrix=$matrixJson" >> $env:GITHUB_OUTPUT
          "image_count=$imageCount" >> $env:GITHUB_OUTPUT
          "paired_rounds=$pairedRounds" >> $env:GITHUB_OUTPUT
          "profile=$profile" >> $env:GITHUB_OUTPUT
          Write-Host "Profile: $profile"
          Write-Host "Images: $imageCount"
          Write-Host "Paired rounds: $pairedRounds"
          Write-Host "Matrix: $matrixJson"

      - name: Install converter and dataset dependencies
        run: python -m pip install -r requirements-converter.txt

      - name: Configure compact and streaming builds
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $common = @(
            '-S', '.',
            '-G', 'Visual Studio 17 2022', '-A', 'x64',
            '-DBUILD_TESTING=ON',
            '-DLW_BUILD_HTTP_DEMO=OFF',
            '-DLW_BUILD_CSHARP_DEMOS=OFF',
            '-DLW_REC_RESIDENT_WIDTHS=OFF'
          )
          cmake @common -B build-benchmark-compact -DLW_EXPERIMENTAL_STREAMING_CROPS=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake @common -B build-benchmark-streaming -DLW_EXPERIMENTAL_STREAMING_CROPS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build benchmark drivers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build-benchmark-compact --config Release --parallel 2 --target full-ocr-dataset-benchmark
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-benchmark-streaming --config Release --parallel 2 --target full-ocr-dataset-benchmark
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate corpus
        shell: pwsh
        env:
          IMAGE_COUNT: ${{ steps.plan.outputs.image_count }}
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/generate_ocr_dataset.py --output build-local-data/ocr-dataset --count $env:IMAGE_COUNT --seed 20260907 --format png --force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/prepare_ocr_dataset_ppm.py --dataset build-local-data/ocr-dataset --output runtime-memory-package/dataset --force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare runtime assets and executables
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Find-Asset([string]$root, [string]$name) {
            $match = Get-ChildItem -LiteralPath $root -Recurse -File -Filter $name | Select-Object -First 1
            if ($null -eq $match) { throw "asset not found: $name under $root" }
            return $match.FullName
          }
          New-Item -ItemType Directory -Force -Path runtime-memory-package/assets/tiny | Out-Null
          foreach ($name in @('det.lwm', 'cls.lwm', 'rec.lwm')) {
            Copy-Item -LiteralPath (Find-Asset 'build-benchmark-compact' $name) -Destination "runtime-memory-package/assets/tiny/$name"
          }
          Copy-Item -LiteralPath models/ppocrv6-tiny/ppocr_keys.txt -Destination runtime-memory-package/assets/tiny/ppocr_keys.txt
          python tools/prepare_ppocrv6_runtime_variant.py --variant small --build-dir build-benchmark-compact --output-dir runtime-memory-package/assets/small
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/prepare_ppocrv6_runtime_variant.py --variant medium --build-dir build-benchmark-compact --output-dir runtime-memory-package/assets/medium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path runtime-memory-package/bin/compact, runtime-memory-package/bin/streaming | Out-Null
          Copy-Item build-benchmark-compact/Release/full-ocr-dataset-benchmark.exe runtime-memory-package/bin/compact/
          Copy-Item build-benchmark-streaming/Release/full-ocr-dataset-benchmark.exe runtime-memory-package/bin/streaming/

      - uses: actions/upload-artifact@v7
        with:
          name: runtime-memory-benchmark-package-${{ github.sha }}
          path: runtime-memory-package/
          if-no-files-found: error
          retention-days: 7

  benchmark:
    name: Streaming crop ${{ matrix.model }} / W${{ matrix.workers }}
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          name: runtime-memory-benchmark-package-${{ github.sha }}
          path: .ci/runtime-memory-package

      - name: Rebuild runner-local image list
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $datasetRoot = (Resolve-Path '.ci/runtime-memory-package/dataset').Path
          $manifest = Get-Content -LiteralPath "$datasetRoot/benchmark-manifest.json" -Raw | ConvertFrom-Json
          $images = @(Get-ChildItem -LiteralPath $datasetRoot -File -Filter '*.ppm' | Sort-Object Name)
          if ($images.Count -ne @($manifest.images).Count) { throw "PPM count mismatch: $($images.Count) != $(@($manifest.images).Count)" }
          $images | ForEach-Object { $_.FullName } | Set-Content -LiteralPath "$datasetRoot/images-runner.txt" -Encoding utf8
          Write-Host "Runner image list: $($images.Count) images"

      - name: Run paired dataset benchmark
        shell: pwsh
        env:
          MODEL: ${{ matrix.model }}
          WORKERS: ${{ matrix.workers }}
          PAIRED_ROUNDS: ${{ needs.prepare.outputs.paired_rounds }}
          PROFILE: ${{ needs.prepare.outputs.profile }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packageRoot = (Resolve-Path '.ci/runtime-memory-package').Path
          $compact = "$packageRoot/bin/compact/full-ocr-dataset-benchmark.exe"
          $streaming = "$packageRoot/bin/streaming/full-ocr-dataset-benchmark.exe"
          $assetRoot = "$packageRoot/assets/$env:MODEL"
          $datasetRoot = "$packageRoot/dataset"
          $output = "runtime-memory-results/$env:MODEL/w$env:WORKERS"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          Write-Host "Profile: $env:PROFILE; Model: $env:MODEL; Workers: $env:WORKERS; Rounds: $env:PAIRED_ROUNDS"
          python tools/compare_ocr_dataset_runtime.py `
            --compact-driver $compact `
            --resident-driver $streaming `
            --candidate-resident-widths false `
            --candidate-label "Streaming Crop" `
            --case-label "$env:MODEL/w$env:WORKERS" `
            --det "$assetRoot/det.lwm" `
            --cls "$assetRoot/cls.lwm" `
            --rec "$assetRoot/rec.lwm" `
            --dictionary "$assetRoot/ppocr_keys.txt" `
            --image-list "$datasetRoot/images-runner.txt" `
            --benchmark-manifest "$datasetRoot/benchmark-manifest.json" `
            --warmup 1 --iterations 1 --workers $env:WORKERS --target-width 960 `
            --paired-rounds $env:PAIRED_ROUNDS --process-timeout-seconds 3600 --heartbeat-seconds 60 `
            --json-output "$output/compact-vs-streaming.json" `
            --markdown-output "$output/compact-vs-streaming.md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content -LiteralPath "$output/compact-vs-streaming.md" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: runtime-memory-${{ matrix.model }}-w${{ matrix.workers }}-${{ github.sha }}
          path: runtime-memory-results/${{ matrix.model }}/w${{ matrix.workers }}/
          if-no-files-found: error
          retention-days: 30