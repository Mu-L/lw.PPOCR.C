name: x64 sample OCR release comparison

on:
  workflow_dispatch:
    inputs:
      baseline_tag:
        description: Published release tag to compare against current code
        required: true
        default: v1.0.0
        type: string
      warmup:
        description: Warm-up OCR calls per fresh process
        required: true
        default: "2"
        type: string
      iterations:
        description: Measured OCR calls per fresh process
        required: true
        default: "5"
        type: string
      paired_rounds:
        description: Alternating release/current process pairs per case
        required: true
        default: "3"
        type: string

permissions:
  contents: read

jobs:
  compare:
    name: Three models, 1/4 workers, same x64 runner
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          path: candidate
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.baseline_tag }}
          path: baseline
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: candidate/requirements-converter.txt

      - name: Verify release ref and identical benchmark harness
        shell: pwsh
        env:
          BASELINE_TAG: ${{ inputs.baseline_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exactTag = (git -C baseline describe --tags --exact-match).Trim()
          if ($LASTEXITCODE -ne 0 -or $exactTag -ne $env:BASELINE_TAG) {
            throw "baseline must be an exact published tag: $env:BASELINE_TAG"
          }
          $oldCommit = (git -C baseline rev-parse HEAD).Trim()
          $newCommit = (git -C candidate rev-parse HEAD).Trim()
          if ($oldCommit -eq $newCommit) { throw 'baseline and candidate resolve to the same commit' }
          foreach ($path in @(
            'examples/ocr_benchmark_ppm.c',
            'examples/ppm_image.h',
            'include/lw_infer.h',
            'src/simd/cpu_features.c',
            'src/simd/cpu_features.h'
          )) {
            $oldHash = (Get-FileHash -Algorithm SHA256 -LiteralPath "baseline/$path").Hash
            $newHash = (Get-FileHash -Algorithm SHA256 -LiteralPath "candidate/$path").Hash
            if ($oldHash -ne $newHash) { throw "benchmark/ABI source differs: $path" }
          }
          Write-Host "Release: $env:BASELINE_TAG @ $oldCommit"
          Write-Host "Current: $newCommit"
          Get-CimInstance Win32_Processor | Select-Object Name,NumberOfLogicalProcessors | Format-Table

      - name: Install model converter dependencies
        run: python -m pip install -r candidate/requirements-converter.txt

      - name: Build both source revisions with the same toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $options = @(
            '-G', 'Visual Studio 17 2022', '-A', 'x64',
            '-DBUILD_TESTING=OFF',
            '-DLW_BUILD_HTTP_DEMO=OFF',
            '-DLW_BUILD_CSHARP_DEMOS=OFF',
            '-DLW_REC_RESIDENT_WIDTHS=OFF'
          )
          cmake -S baseline -B build-baseline @options
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S candidate -B build-candidate @options
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-baseline --config Release --parallel 2 --target lw-ocr-benchmark
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-candidate --config Release --parallel 2 --target lw-ocr-benchmark
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare one shared Tiny/Small/Medium LWM set
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($model in @('tiny', 'small', 'medium')) {
            python candidate/tools/prepare_ppocrv6_runtime_variant.py `
              --variant $model --build-dir build-candidate `
              --output-dir "comparison-assets/$model"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run alternating release/current benchmark pairs
        shell: pwsh
        env:
          BASELINE_TAG: ${{ inputs.baseline_tag }}
          WARMUP: ${{ inputs.warmup }}
          ITERATIONS: ${{ inputs.iterations }}
          PAIRED_ROUNDS: ${{ inputs.paired_rounds }}
        run: |
          $ErrorActionPreference = 'Stop'
          $oldCommit = (git -C baseline rev-parse HEAD).Trim()
          $newCommit = (git -C candidate rev-parse HEAD).Trim()
          python candidate/tools/compare_release_sample_ocr.py `
            --baseline-driver build-baseline/Release/lw-ocr-benchmark.exe `
            --candidate-driver build-candidate/Release/lw-ocr-benchmark.exe `
            --assets-root comparison-assets `
            --sample build-candidate/models/sample.ppm `
            --baseline-ref $env:BASELINE_TAG `
            --baseline-commit $oldCommit `
            --candidate-commit $newCommit `
            --warmup $env:WARMUP `
            --iterations $env:ITERATIONS `
            --paired-rounds $env:PAIRED_ROUNDS `
            --output-dir comparison-results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish comparison summary
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'comparison-results/report.md') {
            Get-Content -LiteralPath 'comparison-results/report.md' -Raw |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: x64-sample-release-comparison-${{ github.sha }}
          path: comparison-results/
          if-no-files-found: warn
          retention-days: 30
